<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome, Mike</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --accent3: #f59e0b;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: -50%;
      background: conic-gradient(
        from 0deg at 50% 50%,
        var(--accent1) 0%,
        transparent 25%,
        var(--accent2) 50%,
        transparent 75%,
        var(--accent3) 100%
      );
      opacity: 0.08;
      animation: spin 20s linear infinite;
      border-radius: 50%;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 500px; height: 500px; background: var(--accent1); top: -150px; left: -150px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; animation-delay: -4s; }
    .orb-3 { width: 300px; height: 300px; background: var(--accent3); top: 50%; left: 60%; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* Grid overlay */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 4rem 5rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2rem;
      backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(124,58,237,0.2),
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.1);
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
      background: rgba(6,182,212,0.1);
      border: 1px solid rgba(6,182,212,0.25);
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 2rem;
      animation: fadeUp 1s 0.2s cubic-bezier(0.16,1,0.3,1) both;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      animation: fadeUp 1s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    h1 .welcome {
      display: block;
      color: rgba(255,255,255,0.5);
      font-weight: 300;
      font-size: 0.45em;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.3em;
    }

    h1 .name {
      display: block;
      background: linear-gradient(135deg, #fff 0%, var(--accent2) 50%, var(--accent1) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      border-radius: 999px;
      margin: 2rem auto;
      animation: fadeUp 1s 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .subtitle {
      font-size: 1.1rem;
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.04em;
      animation: fadeUp 1s 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* Pulsing ring */
    .ring {
      position: absolute;
      inset: -2px;
      border-radius: 2rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
      z-index: -1;
      opacity: 0;
      animation: pulse-ring 3s 1.5s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0; transform: scale(1); }
      50%       { opacity: 0.15; transform: scale(1.01); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid"></div>

  <div class="card">
    <div class="ring"></div>
    <div class="tag">&#9679; Online</div>
    <h1>
      <span class="welcome">Welcome</span>
      <span class="name">Mike</span>
    </h1>
    <div class="divider"></div>
    <p class="subtitle">Glad you're here. Let's build something great.</p>
  </div>
</body>
</html>
